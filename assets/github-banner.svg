<svg width="1600" height="400" viewBox="0 0 1600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="60%" stop-color="#0A0D12"/>
      <stop offset="100%" stop-color="#060809"/>
    </linearGradient>

    <radialGradient id="glow" cx="18%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#DB6D28" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#DB6D28" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow2" cx="88%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#F0883E" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#F0883E" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFA657"/>
      <stop offset="100%" stop-color="#DB6D28"/>
    </linearGradient>

    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA657"/>
      <stop offset="100%" stop-color="#DB6D28"/>
    </linearGradient>

    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#F0883E" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>

    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- base -->
  <rect width="1600" height="400" fill="url(#bg)"/>
  <rect width="1600" height="400" fill="url(#grid)"/>
  <rect width="1600" height="400" fill="url(#glow)"/>
  <rect width="1600" height="400" fill="url(#glow2)"/>

  <!-- top accent bar -->
  <rect x="0" y="0" width="1600" height="4" fill="url(#orange)"/>

  <!-- availability badge -->
  <rect x="1366" y="28" width="194" height="32" rx="16" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <circle cx="1389" cy="44" r="4.5" fill="#3FB950">
    <animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <text x="1402" y="49" font-size="12.5" font-family="'Segoe UI', Arial, sans-serif" fill="#7EE787" font-weight="700" letter-spacing="0.4">AVAILABLE FOR WORK</text>

  <!-- ===== LEFT: IDENTITY ===== -->
  <circle cx="140" cy="200" r="72" fill="#161B22" stroke="url(#ring)" stroke-width="3"/>
  <text x="140" y="216" text-anchor="middle" font-size="46" font-family="'Segoe UI', Arial, sans-serif" fill="#E6EDF3" font-weight="700">JA</text>

  <text x="248" y="150" font-size="13.5" font-family="'Segoe UI', Arial, sans-serif" fill="#FFA657" font-weight="700" letter-spacing="2.5">AI AUTOMATION ENGINEER</text>
  <text x="248" y="205" font-size="46" font-family="'Segoe UI', Arial, sans-serif" fill="#E6EDF3" font-weight="800">Jhonson Ayalew</text>
  <text x="248" y="238" font-size="16.5" font-family="'Segoe UI', Arial, sans-serif" fill="#8B949E">Python Developer &#160;·&#160; Full-Stack Developer &#160;·&#160; LLM Workflow Builder</text>

  <!-- stat chips -->
  <g font-family="'Segoe UI', Arial, sans-serif">
    <rect x="248" y="262" width="108" height="34" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <text x="302" y="284" text-anchor="middle" font-size="13" fill="#E6EDF3" font-weight="700">2+ Yrs Exp</text>

    <rect x="366" y="262" width="150" height="34" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <text x="441" y="284" text-anchor="middle" font-size="13" fill="#E6EDF3" font-weight="700">5+ Systems Shipped</text>

    <rect x="526" y="262" width="176" height="34" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <text x="614" y="284" text-anchor="middle" font-size="13" fill="#E6EDF3" font-weight="700">100K+ Records Processed</text>

    <rect x="712" y="262" width="164" height="34" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <text x="794" y="284" text-anchor="middle" font-size="13" fill="#E6EDF3" font-weight="700">Remote &#160;·&#160; Ethiopia</text>
  </g>

  <text x="248" y="332" font-size="13.5" font-family="'Segoe UI', Arial, sans-serif" fill="#6E7681">Building AI-powered systems that turn raw data into scored, delivered results.</text>

  <!-- ===== RIGHT: PIPELINE NETWORK ===== -->
  <g filter="url(#soft)">
    <rect x="988" y="96" width="560" height="230" rx="14" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>
  </g>
  <text x="1016" y="132" font-size="12" font-family="'Segoe UI', Arial, sans-serif" fill="#FFA657" font-weight="700" letter-spacing="2">AUTOMATION PIPELINE</text>
  <rect x="988" y="146" width="560" height="1" fill="#30363D"/>

  <!-- connecting curve -->
  <path d="M 1055 190 L 1150 190 L 1150 240 L 1245 240 L 1245 190 L 1340 190 L 1340 240 L 1435 240"
        fill="none" stroke="url(#orange)" stroke-width="2.5" stroke-dasharray="1 9" stroke-linecap="round" opacity="0.85">
    <animate attributeName="stroke-dashoffset" from="0" to="-40" dur="2.4s" repeatCount="indefinite"/>
  </path>

  <!-- node 1 -->
  <circle cx="1055" cy="190" r="26" fill="#161B22" stroke="#F0883E" stroke-width="2"/>
  <text x="1055" y="196" text-anchor="middle" font-size="13" font-family="'Segoe UI', Arial, sans-serif" fill="#F0883E" font-weight="800">01</text>
  <text x="1055" y="240" text-anchor="middle" font-size="13.5" font-family="'Segoe UI', Arial, sans-serif" fill="#E6EDF3" font-weight="700">Scrape</text>

  <!-- node 2 -->
  <circle cx="1245" cy="240" r="26" fill="#161B22" stroke="#F0883E" stroke-width="2"/>
  <text x="1245" y="246" text-anchor="middle" font-size="13" font-family="'Segoe UI', Arial, sans-serif" fill="#F0883E" font-weight="800">02</text>
  <text x="1245" y="290" text-anchor="middle" font-size="13.5" font-family="'Segoe UI', Arial, sans-serif" fill="#E6EDF3" font-weight="700">Score</text>

  <!-- node 3 -->
  <circle cx="1340" cy="190" r="26" fill="#161B22" stroke="#F0883E" stroke-width="2"/>
  <text x="1340" y="196" text-anchor="middle" font-size="13" font-family="'Segoe UI', Arial, sans-serif" fill="#F0883E" font-weight="800">03</text>
  <text x="1340" y="240" text-anchor="middle" font-size="13.5" font-family="'Segoe UI', Arial, sans-serif" fill="#E6EDF3" font-weight="700">Load</text>

  <!-- node 4 -->
  <circle cx="1435" cy="240" r="28" fill="#161B22" stroke="#FFA657" stroke-width="2.6"/>
  <text x="1435" y="246" text-anchor="middle" font-size="13" font-family="'Segoe UI', Arial, sans-serif" fill="#FFA657" font-weight="800">04</text>
  <text x="1435" y="292" text-anchor="middle" font-size="13.5" font-family="'Segoe UI', Arial, sans-serif" fill="#FFA657" font-weight="700">Deliver</text>

  <text x="1268" y="132" font-size="11.5" font-family="'Segoe UI', Arial, sans-serif" fill="#6E7681" text-anchor="end">Web &#8594; LLM &#8594; DB &#8594; Telegram / Email / Dashboard</text>

  <!-- footer line -->
  <rect x="0" y="396" width="1600" height="4" fill="url(#orange)" opacity="0.5"/>
</svg>
