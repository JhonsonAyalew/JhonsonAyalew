<svg viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Blueprint-style diagram of three stacked layers: Foundation with Python, Node.js and JavaScript; Logic with web scraping, ETL, scheduled automation and AI data annotation; Interface with Telegram Bot API, React and REST APIs">
  <rect width="1200" height="480" fill="#121212"/>

  <!-- vertical connector -->
  <line x1="600" y1="80" x2="600" y2="400" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1"/>
  <circle cx="600" cy="130" r="3" fill="#C94B4B"/>
  <circle cx="600" cy="240" r="3" fill="#C94B4B"/>
  <circle cx="600" cy="350" r="3" fill="#C94B4B"/>

  <!-- layer 1: FOUNDATION -->
  <rect x="250" y="95" width="700" height="70" fill="#1A1A1A" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="280" y="122" fill="#C94B4B" font-size="11" font-weight="700" letter-spacing="3">FOUNDATION</text>
    <text x="280" y="148" fill="#F4F4F2" font-size="15" letter-spacing="0.5">Python · Node.js · JavaScript</text>
  </g>

  <!-- layer 2: LOGIC -->
  <rect x="250" y="205" width="700" height="70" fill="#1A1A1A" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="280" y="232" fill="#C94B4B" font-size="11" font-weight="700" letter-spacing="3">LOGIC</text>
    <text x="280" y="258" fill="#F4F4F2" font-size="15" letter-spacing="0.5">Web scraping · Scheduled automation · AI data annotation</text>
  </g>

  <!-- layer 3: INTERFACE -->
  <rect x="250" y="315" width="700" height="70" fill="#1A1A1A" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="280" y="342" fill="#C94B4B" font-size="11" font-weight="700" letter-spacing="3">INTERFACE</text>
    <text x="280" y="368" fill="#F4F4F2" font-size="15" letter-spacing="0.5">Telegram Bot API · React · REST APIs</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="600" y="435" fill="#A6A6A0" font-size="12" letter-spacing="1">DATA SOURCES → INGESTION → TRANSFORMATION → DELIVERY</text>
  </g>
</svg>
