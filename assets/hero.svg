<svg viewBox="0 0 1200 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abstract visualization of scattered points on the left resolving into a single precise circle on the right, representing chaos becoming an ordered system">
  <defs>
    <radialGradient id="bgGlow" cx="82%" cy="46%" r="60%">
      <stop offset="0%" stop-color="#1c1414" stop-opacity="1"/>
      <stop offset="100%" stop-color="#121212" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lineFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A6A6A0" stop-opacity="0"/>
      <stop offset="55%" stop-color="#A6A6A0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#C94B4B" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="460" fill="#121212"/>
  <rect width="1200" height="460" fill="url(#bgGlow)"/>

  <!-- scattered chaos points, left third -->
  <g fill="#A6A6A0">
    <circle cx="70" cy="120" r="2.2" opacity="0.7"/>
    <circle cx="130" cy="80" r="1.6" opacity="0.5"/>
    <circle cx="95" cy="210" r="2.6" opacity="0.8"/>
    <circle cx="180" cy="150" r="1.8" opacity="0.6"/>
    <circle cx="60" cy="260" r="1.5" opacity="0.45"/>
    <circle cx="150" cy="300" r="2.1" opacity="0.65"/>
    <circle cx="220" cy="90" r="1.7" opacity="0.5"/>
    <circle cx="40" cy="180" r="1.9" opacity="0.6"/>
    <circle cx="200" cy="340" r="1.6" opacity="0.45"/>
    <circle cx="110" cy="360" r="2.3" opacity="0.7"/>
    <circle cx="250" cy="230" r="1.5" opacity="0.4"/>
    <circle cx="30" cy="330" r="1.4" opacity="0.4"/>
    <circle cx="170" cy="40" r="1.6" opacity="0.45"/>
  </g>
  <g stroke="#A6A6A0" stroke-width="0.6" fill="none" opacity="0.35">
    <path d="M70,120 L130,80"/>
    <path d="M95,210 L180,150"/>
    <path d="M150,300 L110,360"/>
    <path d="M60,260 L150,300"/>
    <path d="M220,90 L180,150"/>
    <path d="M40,180 L95,210"/>
    <path d="M200,340 L250,230"/>
  </g>

  <!-- transitional field: lines gradually aligning -->
  <g stroke="url(#lineFade)" stroke-width="1" fill="none" opacity="0.8">
    <path d="M260,150 C 400,140 480,160 560,190"/>
    <path d="M260,220 C 400,215 480,215 560,215"/>
    <path d="M260,290 C 400,270 480,250 560,240"/>
    <path d="M230,260 C 380,250 470,235 560,225"/>
    <path d="M240,90 C 390,110 480,170 560,205"/>
  </g>
  <g fill="#A6A6A0">
    <circle cx="330" cy="175" r="1.6" opacity="0.5"/>
    <circle cx="400" cy="195" r="1.8" opacity="0.55"/>
    <circle cx="460" cy="205" r="1.6" opacity="0.5"/>
  </g>

  <!-- resolved order: precise circle, right third -->
  <circle cx="900" cy="228" r="86" fill="none" stroke="#F4F4F2" stroke-width="1.1" opacity="0.9"/>
  <circle cx="900" cy="228" r="86" fill="none" stroke="#C94B4B" stroke-width="1.4" stroke-dasharray="2 8" opacity="0.9">
    <animateTransform attributeName="transform" type="rotate" from="0 900 228" to="360 900 228" dur="60s" repeatCount="indefinite"/>
  </circle>
  <circle cx="900" cy="228" r="2.6" fill="#C94B4B"/>
  <circle cx="900" cy="228" r="118" fill="none" stroke="#F4F4F2" stroke-width="0.5" opacity="0.18"/>

  <!-- hero copy -->
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="70" y="410" fill="#F4F4F2" font-size="42" font-weight="700" letter-spacing="1">JOHNSON AYLEW</text>
    <text x="70" y="440" fill="#C94B4B" font-size="14" font-weight="600" letter-spacing="4">AUTOMATION &amp; DATA ENGINEER</text>
  </g>
</svg>
